<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <title>Alice no País das Maravilhas</title>
    <meta name="description" content="Uma aventura de quebra-cabeça em português, baseada no livro de Lewis Carroll (1865)." />
    <meta name="theme-color" content="#1c1410" />
    <meta property="og:title" content="Alice no País das Maravilhas — Episódio 1: A Toca do Coelho" />
    <meta property="og:description" content="Siga o Coelho Branco, mude de tamanho e descubra como passar pela portinha do Salão das Portas." />
    <meta property="og:image" content="social.jpg" />
    <link rel="icon" type="image/png" href="icon-64.png" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #120d0a;
        overflow: hidden;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      #game {
        position: fixed;
        inset: 0;
      }
      /* Screens wider than the game's 16:9 (most phones) show margins at the sides: there, a
         stage curtain on each side, the paper theatre's own (main.ts sets --curtain), dark and
         muted so it frames the game without drawing the eye. Narrower screens keep the plain dark
         bars. */
      @media (min-aspect-ratio: 16/9) {
        #game::before,
        #game::after {
          content: '';
          position: absolute;
          top: 0;
          bottom: 0;
          width: 50%;
          z-index: -1;
          pointer-events: none;
          background: var(--curtain, none) left top / auto 100% repeat-x;
          filter: brightness(0.3) saturate(0.65);
        }
        #game::before {
          left: 0;
        }
        #game::after {
          right: 0;
          transform: scaleX(-1);
        }
      }
      #rotate {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 10;
        background: #1c1410;
        color: #f3e6c8;
        font: 22px Georgia, serif;
        text-align: center;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      #rotate span {
        font-size: 64px;
        display: block;
        margin-bottom: 12px;
      }
      /* "Turn your device" only where the game would be too small to play upright: a touch
         screen less than 600 px wide (a phone). Tablets, foldables and wide enough split-screen
         windows show the whole game with dark bars above and below. src/hold.ts pauses the game
         with this same query. */
      @media (orientation: portrait) and (pointer: coarse) and (max-width: 599.98px) {
        #rotate {
          display: flex;
        }
      }
    </style>
    <script type="module" crossorigin src="./assets/index-D_R0I5CT.js"></script>
  </head>
  <body>
    <div id="game"></div>
    <div id="rotate">
      <span>⟳</span>
      <div id="rotate-message">Gire o aparelho para jogar na horizontal.</div>
    </div>
  </body>
</html>
